[package]
name = "canvas-studio"
version = "1.7.0"
edition = "2021"
description = "A standalone, offline visual design and print editor"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
ab_glyph = "0.2"
ttf-parser = "0.25.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1"

[profile.release]
strip = "symbols"
