name: Linux checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native libraries and PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev poppler-utils
      - name: Install Rust formatting support
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Check embedded resources outside the source directory
        run: |
          studio_binary="$PWD/target/release/canvas-studio"
          cd /tmp
          "$studio_binary" --self-check
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-studio-linux-x86_64
          path: target/release/canvas-studio
