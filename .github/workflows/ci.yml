name: Linux checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native libraries and PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev poppler-utils ffmpeg desktop-file-utils xvfb libxtst6 x11-utils libxkbcommon-x11-0 libgl1-mesa-dri libegl-mesa0 libglx-mesa0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned local motion renderer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/hyperframes
          HYPERFRAMES_NO_TELEMETRY=1 HYPERFRAMES_NO_UPDATE_CHECK=1 node tools/hyperframes/node_modules/hyperframes/bin/hyperframes.mjs browser ensure
      - name: Install Rust formatting support
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Check embedded resources outside the source directory
        run: |
          studio_binary="$PWD/target/release/canvas-studio"
          cd /tmp
          "$studio_binary" --self-check
      - name: Install browser regression tools
        run: |
          python3 -m venv .ui-venv
          .ui-venv/bin/pip install -r scripts/ui-requirements.txt
          .ui-venv/bin/python -m playwright install --with-deps chromium
      - name: Exercise the browser editor and native window
        run: |
          .ui-venv/bin/python scripts/browser_smoke.py --binary target/release/canvas-studio --chrome chromium
          .ui-venv/bin/python scripts/native_smoke.py --binary target/release/canvas-studio
      - name: Exercise the STDIO agent protocol and workspace delivery
        run: .ui-venv/bin/python scripts/mcp_smoke.py --binary target/release/canvas-studio
      - name: Exercise cross-format campaigns and live layout editing
        run: .ui-venv/bin/python scripts/campaign_smoke.py --binary target/release/canvas-studio --chrome chromium
      - name: Exercise media timing, audio, portable recovery and Film UI
        run: .ui-venv/bin/python scripts/media_smoke.py --binary target/release/canvas-studio --chrome chromium
      - name: Exercise deterministic HyperFrames motion and source delivery
        run: .ui-venv/bin/python scripts/motion_smoke.py --binary target/release/canvas-studio --chrome chromium
      - name: Exercise Three.js product scenes and desktop launcher repair
        run: |
          python3 scripts/desktop_launcher_smoke.py
          .ui-venv/bin/python scripts/mockup_smoke.py --binary target/release/canvas-studio --chrome chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-studio-ui-proofs
          path: |
            qa/mockups/*.png
            qa/mockups/report.json
            qa/motion/motion-ui.png
            qa/motion/report.json
            qa/media/film-ui.png
            qa/media/report.json
            qa/campaign-ui/*.png
            qa/campaign-ui/report.json
            qa/mcp/agent-preview.png
            qa/mcp/report.json
            qa/browser/*.png
            qa/browser/report.json
            qa/native-smoke/*.png
            qa/native-smoke/result.txt
            qa/native-smoke/native.log
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-studio-linux-x86_64
          path: target/release/canvas-studio
